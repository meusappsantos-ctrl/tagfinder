<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TagFinder Auth</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#f8fafc" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TagFinder" />
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/15316/15316538.png" />
    <link rel="manifest" href="manifest.json" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
     
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              gray: {
                900: '#0f172a',
                800: '#1e293b',
                700: '#334155',
                50: '#f8fafc',
              }
            }
          }
        }
      }

      // Check theme on load to prevent flash
      if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    </script>

    <style>
      body {
        font-family: 'Inter', sans-serif;
        margin: 0;
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      
      body { background-color: #f8fafc; color: #0f172a; }
      .dark body { background-color: #020617; color: #f1f5f9; }
      
      .leaflet-container {
        background: #f1f5f9 !important;
      }
      .dark .leaflet-container {
        background: #0f172a !important;
      }

      .leaflet-tile-pane {
        filter: brightness(1.0) contrast(1.05) saturate(1.1);
      }
      .dark .leaflet-tile-pane {
        filter: brightness(0.6) contrast(1.2) saturate(0.8) invert(1) hue-rotate(180deg);
      }

      .leaflet-tooltip.tag-label {
        background: rgba(255, 255, 255, 0.98) !important;
        backdrop-filter: blur(16px);
        border: 1px solid rgba(0, 0, 0, 0.1) !important;
        color: #0f172a !important;
        font-weight: 800 !important;
        font-size: 11px !important;
        text-transform: uppercase !important;
        border-radius: 8px !important;
        padding: 6px 14px !important;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1) !important;
        letter-spacing: 0.05em !important;
      }

      .dark .leaflet-tooltip.tag-label {
        background: rgba(15, 23, 42, 0.9) !important;
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
        color: #ffffff !important;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5) !important;
      }

      .leaflet-tooltip-top.tag-label:before {
        border-top-color: rgba(255, 255, 255, 0.98) !important;
      }
      .dark .leaflet-tooltip-top.tag-label:before {
        border-top-color: rgba(15, 23, 42, 0.9) !important;
      }

      .tag-label-ctv { border-left: 4px solid #3b82f6 !important; }
      .tag-label-telecom { border-left: 4px solid #6366f1 !important; }
      .tag-label-painel { border-left: 4px solid #f97316 !important; }
      .tag-label-tw_local { border-left: 4px solid #a855f7 !important; }
      .tag-label-downloads { border-left: 4px solid #06b6d4 !important; }
      
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
      .dark ::-webkit-scrollbar-thumb { background: #334155; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

      .map-vignette::after {
        content: '';
        position: absolute;
        inset: 0;
        box-shadow: inset 0 0 100px rgba(0,0,0,0.1);
        pointer-events: none;
        z-index: 1000;
      }
      .dark .map-vignette::after {
        box-shadow: inset 0 0 100px rgba(0,0,0,0.5);
      }
    </style>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.460.0",
    "firebase/app": "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js",
    "firebase/auth": "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js",
    "xlsx": "https://cdn.sheetjs.com/xlsx-0.20.3/package/xlsx.mjs",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "firebase/": "https://esm.sh/firebase@^12.7.0/",
    "path": "https://esm.sh/path@^0.12.7",
    "vite": "https://esm.sh/vite@^7.3.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "url": "https://esm.sh/url@^0.11.4"
  }
}
</script>
</head>
  <body class="transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
</body>
</html>
